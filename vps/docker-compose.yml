services:
  qalqon-hub:
    build:
      context: ..
      dockerfile: vps/Dockerfile
    container_name: qalqon-vps-hub
    restart: unless-stopped
    environment:
      - QALQON_ROBOT_TOKEN=${QALQON_ROBOT_TOKEN:?QALQON_ROBOT_TOKEN ni .env faylga kiriting!}
      - QALQON_DEFAULT_ROBOT_ID=${QALQON_DEFAULT_ROBOT_ID:-QALQON-01}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: qalqon-caddy
    restart: unless-stopped
    depends_on:
      - qalqon-hub
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - QALQON_DOMAIN=${QALQON_DOMAIN:?QALQON_DOMAIN ni .env faylga kiriting!}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
