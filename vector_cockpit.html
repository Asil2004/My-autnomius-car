<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Vector Desktop Robot - Cockpit</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: #090d16; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 8px; display: flex; flex-direction: column; align-items: center;
    }
    .card {
      background: #151b28; border: 1px solid #2d3748; border-radius: 14px;
      width: 100%; max-width: 460px; padding: 12px; margin-bottom: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }

    /* Robot IP va Aloqa Qatori */
    .ip-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .ip-row label {
      font-size: 0.8rem; font-weight: bold; color: #8b949e; white-space: nowrap;
    }
    .ip-row input {
      flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
      color: #58a6ff; font-size: 0.85rem; font-weight: bold; padding: 6px 10px; outline: none;
    }
    .ip-row input:focus { border-color: #58a6ff; }
    .status-badge {
      font-size: 0.75rem; font-weight: bold; padding: 4px 8px; border-radius: 6px;
      background: rgba(35, 134, 54, 0.2); color: #7ee787; border: 1px solid #238636;
      white-space: nowrap;
    }

    /* Kamera */
    .cam-box {
      position: relative; width: 100%; border-radius: 12px; overflow: hidden;
      background: #000; aspect-ratio: 4/3; margin-bottom: 8px; border: 2px solid #30363d;
    }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .cam-overlay {
      position: absolute; bottom: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between;
    }
    .badge {
      background: rgba(0,0,0,0.75); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; color: #58a6ff;
    }

    /* Boshqaruv Tugmalari */
    .row-btns { display: flex; gap: 6px; margin-bottom: 8px; }
    .btn-action {
      flex: 1; padding: 12px 2px; font-size: 0.82rem; font-weight: bold; border: none; border-radius: 8px;
      cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; gap: 4px;
      transition: 0.15s;
    }
    .btn-action:active { transform: scale(0.96); }
    .btn-cam { background: #238636; }
    .btn-track { background: #8957e5; }
    .btn-voice { background: #da3633; }
    .btn-snap { background: #1f6feb; }
    .btn-active { box-shadow: 0 0 14px #388bfd; border: 2px solid #58a6ff; }
    .btn-pulse {
      animation: pulseAnim 1.2s infinite;
      background: #b62324 !important;
      border: 2px solid #ff7b72 !important;
    }
    @keyframes pulseAnim {
      0% { box-shadow: 0 0 0 0 rgba(248, 81, 73, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(248, 81, 73, 0); }
      100% { box-shadow: 0 0 0 0 rgba(248, 81, 73, 0); }
    }

    /* Tezkor Matn/Savol Chat Qatori */
    .chat-box { display: flex; gap: 6px; margin-bottom: 8px; }
    .chat-box input {
      flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
      color: #e6edf3; font-size: 0.85rem; padding: 8px 10px; outline: none;
    }
    .chat-box input:focus { border-color: #58a6ff; }
    .chat-box button {
      background: #238636; color: white; border: none; border-radius: 8px;
      padding: 0 12px; font-size: 0.85rem; font-weight: bold; cursor: pointer;
    }

    /* Live Javob va Status Log */
    .live-log {
      background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
      padding: 8px 10px; font-size: 0.85rem; color: #7ee787; min-height: 42px; line-height: 1.4;
    }

    /* Joystick D-Pad */
    .dpad {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      max-width: 230px; margin: 0 auto 8px auto;
    }
    .btn {
      background: #21262d; color: #f0f6fc; border: 1px solid #30363d; border-radius: 10px;
      padding: 12px; font-size: 1.2rem; font-weight: bold; cursor: pointer; text-align: center;
      user-select: none;
    }
    .btn:active { background: #388bfd; color: white; transform: scale(0.95); }
    .btn-stop { background: #da3633; border-color: #f85149; }

    .mood-grid { display: flex; justify-content: space-between; gap: 4px; }
    .btn-mood {
      flex: 1; padding: 8px 2px; font-size: 0.8rem; background: #30363d; border: none; border-radius: 8px;
      color: white; cursor: pointer; font-weight: 500;
    }
    .btn-mood:active { background: #58a6ff; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Robot IP va Holati -->
    <div class="ip-row">
      <label>Robot IP:</label>
      <input type="text" id="robotIp" value="192.168.4.1" placeholder="masalan: 192.168.4.1" onchange="updateRobotIpFromInput()">
      <span class="status-badge" id="robotConnBadge">🟢 Tayyor</span>
    </div>

    <!-- Kamera Bloki -->
    <div class="cam-box">
      <video id="webcam" playsinline autoplay muted></video>
      <canvas id="overlayCanvas"></canvas>
      <div class="cam-overlay">
        <span class="badge" id="trackingStatus">Kamera: O'chiq</span>
        <span class="badge" id="aiVisionStatus">AI: Tayyor</span>
      </div>
    </div>

    <!-- Tezkor Asosiy Tugmalar -->
    <div class="row-btns">
      <button class="btn-action btn-cam" id="btnToggleCam" onclick="toggleCamera()">📷 Kamera</button>
      <button class="btn-action btn-track" id="btnToggleTrack" onclick="toggleAutoTrack()">🎯 Kuzatuv</button>
      <button class="btn-action btn-voice" id="btnToggleVoice" onclick="toggleVoice()">🎙️ Ovoz</button>
      <button class="btn-action btn-snap" onclick="captureAndAskVision()">📸 Qara AI</button>
    </div>

    <!-- Matnli Suhbat Qatori -->
    <div class="chat-box">
      <input type="text" id="chatInput" placeholder="Robotga savol yozing yoki mikrofondan gapiring..." onkeydown="if(event.key==='Enter') sendChatPrompt()">
      <button onclick="sendChatPrompt()">Yuborish</button>
    </div>

    <!-- Natija va Nutq Logi -->
    <div class="live-log" id="voiceLog">🤖 Robot bilan muloqotga tayyorman! Savol bering yoki 'Qara AI' tugmasini bosing.</div>
  </div>

  <div class="card">
    <div class="dpad">
      <div></div>
      <button class="btn" onmousedown="sendCmd('F:180')" onmouseup="sendCmd('S')" ontouchstart="sendCmd('F:180')" ontouchend="sendCmd('S')">▲</button>
      <div></div>
      <button class="btn" onmousedown="sendCmd('L:160')" onmouseup="sendCmd('S')" ontouchstart="sendCmd('L:160')" ontouchend="sendCmd('S')">◀</button>
      <button class="btn btn-stop" onclick="sendCmd('S')">■</button>
      <button class="btn" onmousedown="sendCmd('R:160')" onmouseup="sendCmd('S')" ontouchstart="sendCmd('R:160')" ontouchend="sendCmd('S')">▶</button>
      <div></div>
      <button class="btn" onmousedown="sendCmd('B:180')" onmouseup="sendCmd('S')" ontouchstart="sendCmd('B:180')" ontouchend="sendCmd('S')">▼</button>
      <div></div>
    </div>

    <div class="mood-grid">
      <button class="btn-mood" onclick="sendCmd('WIGGLE')">💃 Raqs</button>
      <button class="btn-mood" onclick="sendCmd('SPIN:R:600')">🔄 Aylan</button>
      <button class="btn-mood" onclick="setMood('happy')">😊 Quvnoq</button>
      <button class="btn-mood" onclick="setMood('curious')">🧐 Qiziq</button>
      <button class="btn-mood" onclick="setMood('angry')">😠 Jahl</button>
    </div>
  </div>

  <script>
    const GEMINI_API_KEY = "";
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlayCanvas');
    const ctx = canvas.getContext('2d');
    const voiceLog = document.getElementById('voiceLog');
    const trackingStatus = document.getElementById('trackingStatus');
    const robotIpInput = document.getElementById('robotIp');
    const chatInput = document.getElementById('chatInput');
    const btnVoice = document.getElementById('btnToggleVoice');

    let currentRobotIp = "http://192.168.4.1";
    let isCamRunning = false;
    let isTracking = false;
    let isVoiceListening = false;
    let recognition = null;
    let trackInterval = null;

    function setRobotIp(ip) {
      if (!ip.startsWith("http://") && !ip.startsWith("https://")) {
        ip = "http://" + ip;
      }
      currentRobotIp = ip;
      robotIpInput.value = ip.replace("http://", "").replace("https://", "");
    }

    function updateRobotIpFromInput() {
      let val = robotIpInput.value.trim();
      if (!val) val = "192.168.4.1";
      setRobotIp(val);
      // Agar Android native interfeys bo'lsa
      if (window.AndroidBridge && typeof window.AndroidBridge.onIpChangedFromWeb === 'function') {
        window.AndroidBridge.onIpChangedFromWeb(val);
      }
    }

    function getBaseUrl() {
      return currentRobotIp;
    }

    // Telefonning o'zidan to'liq ovozli gapirish (Android Native TTS)
    function speakAloud(text) {
      if (!text) return;
      if (window.AndroidBridge && typeof window.AndroidBridge.speakNative === 'function') {
        window.AndroidBridge.speakNative(text);
        return;
      }
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'uz-UZ';
          utterance.rate = 1.0;  // Edge TTS 1x tezlik
          utterance.pitch = 1.0; // 1x tabiiy ohang

          // Edge TTS Sardor (uz-UZ-SardorNeural)
          const allVoices = window.speechSynthesis.getVoices();
          const sardor = allVoices.find(v => 
            v.name.toLowerCase().includes('sardor') ||
            v.voiceURI.toLowerCase().includes('sardor') ||
            v.name.includes('uz-UZ-SardorNeural')
          ) || allVoices.find(v => v.lang === 'uz-UZ' || v.lang.startsWith('uz'));
          if (sardor) utterance.voice = sardor;

          window.speechSynthesis.speak(utterance);
        }
      } catch (e) {
        console.warn("TTS xatosi:", e);
      }
    }

    async function toggleCamera() {
      if (isCamRunning) {
        if (video.srcObject) {
          video.srcObject.getTracks().forEach(t => t.stop());
          video.srcObject = null;
        }
        isCamRunning = false;
        document.getElementById('btnToggleCam').classList.remove('btn-active');
        trackingStatus.innerText = "Kamera: O'chiq";
        return;
      }

      const options = [
        { video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false },
        { video: { facingMode: "user" }, audio: false },
        { video: true, audio: false }
      ];

      for (let opt of options) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia(opt);
          video.srcObject = stream;
          await video.play();
          isCamRunning = true;
          document.getElementById('btnToggleCam').classList.add('btn-active');
          trackingStatus.innerText = "Kamera: Faol";
          voiceLog.innerText = "📷 Kamera faol! Endi 'Avto-Kuzatuv' yoki 'Qara AI' ni bosing.";
          return;
        } catch (e) {
          console.warn("Camera fallback...", e);
        }
      }
      alert("Kamerani ochib bo'lmadi. Telefon sozlamalarida kamera ruxsati borligini tekshiring.");
    }

    function toggleAutoTrack() {
      if (!isCamRunning) {
        alert("Avval '📷 Kamera' tugmasini yoqing!");
        return;
      }
      isTracking = !isTracking;
      const btn = document.getElementById('btnToggleTrack');

      if (isTracking) {
        btn.classList.add('btn-active');
        trackingStatus.innerText = "🎯 Kuzatuv: Izlamoqda...";
        trackInterval = setInterval(processTrackingFrame, 180);
      } else {
        btn.classList.remove('btn-active');
        trackingStatus.innerText = "Kamera: Faol";
        clearInterval(trackInterval);
        sendCmd('S');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function processTrackingFrame() {
      if (!isCamRunning || !video.videoWidth) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      let sumX = 0, sumY = 0, count = 0;
      for (let y = 0; y < canvas.height; y += 8) {
        for (let x = 0; x < canvas.width; x += 8) {
          const idx = (y * canvas.width + x) * 4;
          const r = data[idx], g = data[idx+1], b = data[idx+2];
          if (r > 95 && g > 40 && b > 20 && r > g && r > b) {
            sumX += x;
            sumY += y;
            count++;
          }
        }
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (count > 80) {
        const avgX = sumX / count;
        const avgY = sumY / count;
        const normX = avgX / canvas.width;
        const ratio = count / (canvas.width * canvas.height / 64);

        ctx.strokeStyle = "#00FF66";
        ctx.lineWidth = 4;
        ctx.strokeRect(avgX - 40, avgY - 40, 80, 80);

        if (normX < 0.38) {
          trackingStatus.innerText = "🎯 Chapda -> Burilmoqda";
          sendAct('L:160', 'curious', 'Kuzatuv: Chapga qarayapman');
        } else if (normX > 0.62) {
          trackingStatus.innerText = "🎯 O'ngda -> Burilmoqda";
          sendAct('R:160', 'curious', 'Kuzatuv: O\'ngga qarayapman');
        } else {
          if (ratio < 0.12) {
            trackingStatus.innerText = "🎯 Oldinda -> Ergashyapman";
            sendAct('F:180', 'happy', 'Kuzatuv: Oldinga kelyapman!');
          } else {
            trackingStatus.innerText = "🎯 Yaqin -> To'xtadim";
            sendAct('S', 'happy', 'Kuzatuv: Yetib keldim :)');
          }
        }
      } else {
        trackingStatus.innerText = "🎯 Izlamoqda...";
        sendCmd('S');
      }
    }

    // Ovozli boshqaruv: Qotib qolmasligi va bir martada to'g'ri ishlashi
    function toggleVoice() {
      // 1. Agar allaqachon eshitayotgan bo'lsa -> To'xtatish
      if (isVoiceListening) {
        stopVoiceListening();
        voiceLog.innerText = "🎙️ Ovoz to'xtatildi.";
        return;
      }

      // Android Native nutq tizimi mavjud bo'lsa
      if (window.AndroidBridge && typeof window.AndroidBridge.startNativeVoice === 'function') {
        window.AndroidBridge.startNativeVoice();
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        voiceLog.innerHTML = "💡 Pastdagi qatorga yozing yoki klaviatura mikrofoni orqali gapiring!";
        chatInput.focus();
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false; // Doimiy qolib ketmasligi uchun bir savol/buyruqdan so'ng to'xtaydi!
      recognition.interimResults = false;
      recognition.lang = 'uz-UZ';

      recognition.onstart = () => {
        isVoiceListening = true;
        btnVoice.classList.add('btn-pulse');
        btnVoice.innerText = "🔴 Tinglayapman";
        voiceLog.innerText = "🎙️ Gapiring... (Savol yoki buyruq bering)";
      };

      recognition.onresult = (event) => {
        stopVoiceListening();
        const text = event.results[0][0].transcript.toLowerCase().trim();
        handleUserSpeech(text);
      };

      recognition.onerror = (e) => {
        stopVoiceListening();
        if (e.error === 'network') {
          voiceLog.innerHTML = "⚠️ <b>Ovoz uchun internet kerak.</b><br>Pastdagi qatorga yozishingiz yoki klaviaturadagi mikrofonni bosishingiz mumkin!";
          chatInput.focus();
        } else if (e.error === 'no-speech') {
          voiceLog.innerText = "Ovoz eshitilmadi. Qaytadan '🎙️ Ovoz' tugmasini bosing.";
        } else {
          voiceLog.innerText = "⚠️ Ovoz xabari: " + e.error;
        }
      };

      recognition.onend = () => {
        stopVoiceListening();
      };

      try {
        recognition.start();
      } catch (err) {
        stopVoiceListening();
        voiceLog.innerText = "Xato: " + err.message;
      }
    }

    function stopVoiceListening() {
      isVoiceListening = false;
      if (recognition) {
        try { recognition.stop(); } catch(e){}
      }
      btnVoice.classList.remove('btn-pulse');
      btnVoice.innerText = "🎙️ Ovoz";
    }

    // Foydalanuvchi ovozi yoki matnini tahlil qilish
    function handleUserSpeech(text) {
      voiceLog.innerText = "🗣️ Eshitdim: \"" + text + "\"";

      if (text.includes("oldinga") || text.includes("yur") || text.includes("bos")) {
        sendAct('F:180', 'happy', 'Oldinga!');
        speakAloud("Oldinga yuryapman");
      } else if (text.includes("orqaga") || text.includes("qayt")) {
        sendAct('B:180', 'curious', 'Orqaga!');
        speakAloud("Orqaga qaytyapman");
      } else if (text.includes("chapga")) {
        sendAct('L:160', 'curious', 'Chapga!');
        speakAloud("Chapga burilyapman");
      } else if (text.includes("o'ngga") || text.includes("ongga")) {
        sendAct('R:160', 'curious', 'O\'ngga!');
        speakAloud("O'ngga burilyapman");
      } else if (text.includes("to'xta") || text.includes("stop") || text.includes("tur")) {
        sendAct('S', 'idle', 'To\'xtadim.');
        speakAloud("To'xtadim");
      } else if (text.includes("raqs") || text.includes("o'yna")) {
        sendAct('WIGGLE', 'happy', 'Raqsga tushyapman!', 1);
        speakAloud("Raqsga tushyapman!");
      } else if (text.includes("aylan")) {
        sendAct('SPIN:R:600', 'surprised', 'Aylanyapman!', 1);
        speakAloud("Aylanyapman!");
      } else if (text.includes("salom") || text.includes("qandaysan")) {
        sendAct('S', 'happy', 'Salom do\'stim!', 1);
        speakAloud("Salom do'stim! Seni ko'rganimdan xursandman!");
      } else {
        // Gemini AI ga yuborish
        voiceLog.innerText = "🤖 Gemini AI javob tayyorlamoqda...";
        askGeminiText(text);
      }
    }

    function sendChatPrompt() {
      const val = chatInput.value.trim();
      if (!val) return;
      chatInput.value = '';
      handleUserSpeech(val);
    }

    // Matnli savolga Gemini javobi
    async function askGeminiText(prompt) {
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: "Sen Vector uslubidagi quvnoq stol robotisan. Foydalanuvchiga samimiy, 1-2 qisqa o'zbekcha gap bilan javob ber. Javobing boshida [HAPPY], [CURIOUS], [ANGRY], [SURPRISED] va [F], [B], [SPIN_L], [SPIN_R], [WIGGLE] teglari bo'lsin. Savol: " + prompt
              }]
            }]
          })
        });

        const json = await res.json();
        if (json.candidates && json.candidates[0].content) {
          parseAndExecuteAiResponse(json.candidates[0].content.parts[0].text);
        } else {
          voiceLog.innerText = "AI javob bermadi.";
        }
      } catch (e) {
        voiceLog.innerText = "AI Aloqa xatosi: " + e.message;
      }
    }

    // Kamera orqali ko'rish va gapirish
    async function captureAndAskVision() {
      if (!isCamRunning) {
        alert("Avval '📷 Kamera' tugmasini yoqing!");
        return;
      }

      const aiStatus = document.getElementById('aiVisionStatus');
      aiStatus.innerText = "AI: Ko'rmoqda...";
      voiceLog.innerText = "📸 Kadr olindi, Gemini AI tahlil qilmoqda...";

      canvas.width = 360;
      canvas.height = 270;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const base64Data = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: "Sen kichik aqlli stol robotisan (Vector kabi). Ushbu rasmda nima ko'ryapsan? 1-2 qisqa o'zbekcha gap bilan javob ber. Javobing boshida emotsiya tegi [HAPPY], [CURIOUS], [ANGRY], [SURPRISED] va harakat tegi [F], [B], [SPIN_L], [SPIN_R], [WIGGLE] qo'sh." },
                { inline_data: { mime_type: "image/jpeg", data: base64Data } }
              ]
            }]
          })
        });

        const json = await res.json();
        aiStatus.innerText = "AI: Tayyor";

        if (json.candidates && json.candidates[0].content) {
          parseAndExecuteAiResponse(json.candidates[0].content.parts[0].text);
        } else {
          voiceLog.innerText = "AI javob berishda xatolik yuz berdi.";
        }
      } catch (e) {
        aiStatus.innerText = "AI Xato";
        voiceLog.innerText = "Aloqa xatosi: " + e.message;
      }
    }

    // AI Javobini tozalash, gapirish va robotga yuborish
    function parseAndExecuteAiResponse(rawText) {
      let mood = 'happy';
      let cmd = 'S';
      if (rawText.includes('[ANGRY]')) mood = 'angry';
      else if (rawText.includes('[SURPRISED]')) mood = 'surprised';
      else if (rawText.includes('[CURIOUS]')) mood = 'curious';

      if (rawText.includes('[F]')) cmd = 'F:180';
      else if (rawText.includes('[B]')) cmd = 'B:180';
      else if (rawText.includes('[SPIN_L]')) cmd = 'SPIN:L:500';
      else if (rawText.includes('[SPIN_R]')) cmd = 'SPIN:R:500';
      else if (rawText.includes('[WIGGLE]')) cmd = 'WIGGLE';

      // Teglarni matndan to'liq olib tashlash
      const cleanText = rawText.replace(/\[.*?\]/g, '').trim();

      // 1. Ekranda toza matn ko'rsatish
      voiceLog.innerText = "🤖 " + cleanText;

      // 2. TELEFON KARNAYIDAN HAM OVOZLI GAPIRISH!
      speakAloud(cleanText);

      // 3. ROBOTNING O'ZIGA HAM YUBORISH (Ekran, Emotsiya, DAC Dinamik, Motor)
      sendAct(cmd, mood, cleanText, 1);
    }

    function sendCmd(val) {
      fetch(getBaseUrl() + '/cmd?val=' + encodeURIComponent(val)).catch(()=>{});
    }
    function setMood(val) {
      fetch(getBaseUrl() + '/mood?val=' + encodeURIComponent(val)).catch(()=>{});
    }
    function sendAct(cmd, mood, text, sound = 0) {
      fetch(`${getBaseUrl()}/act?cmd=${encodeURIComponent(cmd)}&mood=${encodeURIComponent(mood)}&text=${encodeURIComponent(text)}&sound=${sound}`)
        .then(() => {
          document.getElementById('robotConnBadge').innerText = "🟢 Ulangan";
          document.getElementById('robotConnBadge').style.borderColor = "#238636";
        })
        .catch(() => {
          document.getElementById('robotConnBadge').innerText = "🔴 Aloqa yo'q";
          document.getElementById('robotConnBadge').style.borderColor = "#da3633";
        });
    }
  </script>
</body>
