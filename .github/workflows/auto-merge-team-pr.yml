name: Auto-Verify & Auto-Merge Team PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write
  checks: write
  statuses: write

jobs:
  verify-and-automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Frontend Build
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Check if PR author is an official team member
        id: check_author
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          echo "PR Author: $PR_AUTHOR"
          TEAM_MEMBERS="Asil2004 ODILOVDESIGN qoldoshevsarvar648-bit bozorovboburjon408-art ali-ibn-tolib571 muhammad05092005 Abduvali006"
          IS_MEMBER=false
          for member in $TEAM_MEMBERS; do
            if [ "$PR_AUTHOR" = "$member" ]; then
              IS_MEMBER=true
              break
            fi
          done
          echo "is_team_member=$IS_MEMBER" >> $GITHUB_OUTPUT

      - name: Auto-Merge PR for Verified Team Member
        if: steps.check_author.outputs.is_team_member == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Author is verified team member. Auto-merging PR into main..."
          gh pr merge "$PR_URL" --merge --auto || gh pr merge "$PR_URL" --merge --admin || true
