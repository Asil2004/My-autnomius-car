<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>ESP32 ROBOT — PRO CONTROL</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050a0e; --panel: #0a1520; --accent: #00e5ff; --accent2: #00ff88; --accent3: #ff4d6d; --text: #b0ccd8;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Exo 2', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 260px; background: var(--panel); border-right: 1px solid #0d2a3a; padding: 20px; display: flex; flex-direction: column; gap: 20px; z-index: 10; }
        h1 { font-family: 'Share Tech Mono'; font-size: 18px; color: var(--accent); margin: 0; letter-spacing: 2px; }
        .stat-card { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 5px; border: 1px solid #1a3a4a; }
        .label { font-size: 10px; color: #5a7a8a; text-transform: uppercase; }
        .value { font-family: 'Share Tech Mono'; color: var(--accent2); font-size: 16px; }

        /* CANVAS AREA */
        .viewport { flex: 1; position: relative; background: radial-gradient(circle, #0d2a3a 1px, transparent 1px); background-size: 30px 30px; display: flex; align-items: center; justify-content: center; }
        canvas { border: 1px solid rgba(0,229,255,0.1); cursor: crosshair; }

        /* CONTROLS */
        .joystick-zone { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .btn { background: rgba(0,229,255,0.1); border: 1px solid var(--accent); color: var(--accent); padding: 10px; cursor: pointer; font-family: 'Share Tech Mono'; transition: 0.3s; }
        .btn:hover { background: var(--accent); color: var(--bg); box-shadow: 0 0 15px var(--accent); }
        .btn.active { background: var(--accent2); border-color: var(--accent2); color: var(--bg); }

        .overlay-info { position: absolute; bottom: 20px; left: 20px; font-family: 'Share Tech Mono'; font-size: 12px; pointer-events: none; }
    </style>
</head>
<body>

<div class="sidebar">
    <h1>ESP32 ROBOT</h1>
    <div class="stat-card">
        <div class="label">Status</div>
        <div class="value" id="status">CONNECTING...</div>
    </div>

    <div>
        <div class="label">Control Mode</div>
        <div style="display: flex; gap: 5px; margin-top: 5px;">
            <button class="btn active" id="mode0" onclick="setMode(0)">MANUAL</button>
            <button class="btn" id="mode1" onclick="setMode(1)">AUTO-P</button>
        </div>
    </div>

    <div class="joystick-zone">
        <div></div><button class="btn" onmousedown="sendCmd('forward')" onmouseup="sendCmd('stop')">▲</button><div></div>
        <button class="btn" onmousedown="sendCmd('left')" onmouseup="sendCmd('stop')">◀</button>
        <button class="btn" onclick="sendCmd('stop')">■</button>
        <button class="btn" onmousedown="sendCmd('right')" onmouseup="sendCmd('stop')">▶</button>
        <div></div><button class="btn" onmousedown="sendCmd('back')" onmouseup="sendCmd('stop')">▼</button><div></div>
    </div>

    <div class="stat-card">
        <div class="label">IMU Orientation (Z)</div>
        <div class="value" id="deg">0.00°</div>
    </div>

    <button class="btn" style="border-color: var(--accent3); color: var(--accent3);" onclick="clearMap()">CLEAR MAP</button>
</div>

<div class="viewport" id="viewport">
    <canvas id="mapCanvas"></canvas>
    <div class="overlay-info" id="coords">X: 0 | Y: 0</div>
</div>

<script>
    // 1. Firebase Configuration (Sizning ma'lumotlaringiz)
    const firebaseConfig = {
        apiKey: "AIzaSyAGk2Ulw2sR5GMgKmrbKn6n-Eema0Advv4",
        authDomain: "myautonomousrobot.firebaseapp.com",
        databaseURL: "https://myautonomousrobot-default-rtdb.firebaseio.com",
        projectId: "myautonomousrobot"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. State & Canvas Setup
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    let robotPos = { x: 0, y: 0, angle: 0 };
    let mapPoints = []; // Lidar nuqtalari
    let trajectory = []; // Robot yurgan yo'li
    let zoom = 1.0;
    let currentMode = 0;

    function resize() {
        canvas.width = document.getElementById('viewport').clientWidth;
        canvas.height = document.getElementById('viewport').clientHeight;
    }
    window.onresize = resize;
    resize();

    // 3. Real-time Data Listeners
    // Robot holati (ESP32 dan keladi)
    db.ref('/robot/status').on('value', (snap) => {
        const data = snap.val();
        if(!data) return;
        robotPos.x = data.x;
        robotPos.y = data.y;
        robotPos.angle = data.th;
        document.getElementById('deg').innerText = data.th.toFixed(2) + "°";
        document.getElementById('status').innerText = "ONLINE";
        
        // Yo'lni saqlash (Manual rejimda doimiy xarita)
        if(currentMode === 0) trajectory.push({x: data.x, y: data.y});
    });

    // Lidar xaritasi
    db.ref('/robot/lidar_map').on('value', (snap) => {
        const data = snap.val();
        if(data && data.p) {
            // Yangi nuqtalarni qo'shish (Xarita tuzish)
            for (let i = 0; i < data.p.length; i += 2) {
                let angle = data.p[i] + robotPos.angle;
                let dist = data.p[i+1];
                let px = robotPos.x + Math.cos(angle * Math.PI/180) * dist;
                let py = robotPos.y + Math.sin(angle * Math.PI/180) * dist;
                mapPoints.push({x: px, y: py});
            }
            if(mapPoints.length > 5000) mapPoints.shift(); // Xotirani tejash
        }
    });

    // 4. Rendering Loop
    function draw() {
        ctx.fillStyle = "#050a0e";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width/2;
        const cy = canvas.height/2;

        // Xaritadagi nuqtalar (Lidar)
        ctx.fillStyle = "rgba(0, 229, 255, 0.5)";
        mapPoints.forEach(p => {
            ctx.fillRect(cx + (p.x - robotPos.x)*zoom, cy + (p.y - robotPos.y)*zoom, 2, 2);
        });

        // Trayektoriya (Yurgan yo'li)
        ctx.strokeStyle = "rgba(0, 255, 136, 0.3)";
        ctx.beginPath();
        trajectory.forEach((p, i) => {
            let tx = cx + (p.x - robotPos.x)*zoom;
            let ty = cy + (p.y - robotPos.y)*zoom;
            if(i===0) ctx.moveTo(tx, ty); else ctx.lineTo(tx, ty);
        });
        ctx.stroke();

        // Robot belgisi
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(robotPos.angle * Math.PI/180);
        ctx.fillStyle = "#ff4d6d";
        ctx.beginPath();
        ctx.moveTo(10, 0); ctx.lineTo(-10, -7); ctx.lineTo(-10, 7);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        requestAnimationFrame(draw);
    }
    draw();

    // 5. Controls
    function sendCmd(cmd) {
        db.ref('/robot/command').set(cmd);
    }

    function setMode(m) {
        currentMode = m;
        db.ref('/robot/mode').set(m);
        document.getElementById('mode0').classList.toggle('active', m===0);
        document.getElementById('mode1').classList.toggle('active', m===1);
        if(m === 1) trajectory = []; // Avtopilotda qisqa xarita uchun tozalash
    }

    function clearMap() {
        mapPoints = [];
        trajectory = [];
    }

    // A nuqtadan B nuqtaga (Canvas bosilganda)
    canvas.onclick = (e) => {
        if(currentMode !== 1) return;
        const rect = canvas.getBoundingClientRect();
        let targetX = (e.clientX - rect.left - canvas.width/2) / zoom + robotPos.x;
        let targetY = (e.clientY - rect.top - canvas.height/2) / zoom + robotPos.y;
        db.ref('/robot/target').set({x: targetX, y: targetY});
        alert("Target set: " + Math.round(targetX) + ", " + Math.round(targetY));
    };
</script>
</body>
</html>
