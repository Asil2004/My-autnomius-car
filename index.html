<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D500 LIDAR — Wi-Fi Real-Time Map</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
  :root {
    --bg: #050a0e;
    --panel: #0a1520;
    --border: #0d2a3a;
    --accent: #00e5ff;
    --accent2: #00ff88;
    --accent3: #ff4d6d;
    --text: #b0ccd8;
    --dim: #3a5a6a;
    --glow: 0 0 18px rgba(0,229,255,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    background: rgba(10,21,32,0.95);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px);
  }

  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon {
    width: 36px; height: 36px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    position: relative;
    box-shadow: var(--glow);
    animation: radar-line 4s linear infinite;
  }
  @keyframes radar-line { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .logo h1 { font-family: 'Share Tech Mono', monospace; font-size: 18px; color: var(--accent); letter-spacing: 3px; }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: rgba(0,0,0,0.3);
  }

  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .status-dot.connected { background: var(--accent2); box-shadow: 0 0 10px var(--accent2); }

  .main { position: relative; z-index: 1; display: flex; flex: 1; overflow: hidden; }

  .sidebar {
    width: 240px;
    background: rgba(10,21,32,0.9);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 16px;
    gap: 20px;
  }

  .panel-title { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--dim); text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

  .btn {
    width: 100%; padding: 10px; border: 1px solid var(--accent); background: rgba(0,229,255,0.05);
    color: var(--accent); font-family: 'Share Tech Mono', monospace; cursor: pointer; border-radius: 4px; text-transform: uppercase;
  }
  .btn:hover { box-shadow: var(--glow); background: rgba(0,229,255,0.1); }
  .btn.stop { border-color: var(--accent3); color: var(--accent3); }

  .canvas-area { flex: 1; position: relative; background: #000; overflow: hidden; }
  canvas { display: block; }

  .coords-overlay { position: absolute; bottom: 20px; right: 20px; font-family: 'Share Tech Mono', monospace; color: var(--dim); text-align: right; }

  .connect-overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5,10,14,0.9); z-index: 20; transition: opacity 0.5s;
  }
  .connect-overlay.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon"></div>
    <h1>D500 LIDAR</h1>
  </div>
  <div class="status-badge">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">OFFLINE</span>
  </div>
</header>

<div class="main">
  <div class="sidebar">
    <div>
      <div class="panel-title">Harakat Boshqaruvi</div>
      <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top:10px;">
        <div style="grid-column: 2;"><button class="btn" onmousedown="sendCmd('forward')" onmouseup="sendCmd('stop')">▲</button></div>
        <button class="btn" onmousedown="sendCmd('left')" onmouseup="sendCmd('stop')">◀</button>
        <button class="btn stop" onmousedown="sendCmd('stop')">■</button>
        <button class="btn" onmousedown="sendCmd('right')" onmouseup="sendCmd('stop')">▶</button>
      </div>
    </div>

    <div>
      <div class="panel-title">Statistika</div>
      <div style="margin-top:10px; font-size:12px;">
        <p>Nuqtalar: <span id="statPoints" class="stat-value">0</span></p>
        <p>Masofa: <span id="statMaxDist" class="stat-value">0 m</span></p>
      </div>
    </div>

    <button class="btn" style="margin-top:auto;" onclick="clearMap()">Xaritani Tozalash</button>
  </div>

  <div class="canvas-area" id="canvasArea">
    <canvas id="lidarCanvas"></canvas>
    <div class="coords-overlay" id="coordsOverlay">X: 0 mm | Y: 0 mm</div>
    
    <div class="connect-overlay" id="connectOverlay">
      <h2 style="color:var(--accent); margin-bottom:20px;">ASTRA-OS v2.0</h2>
      <button class="btn" style="width:200px;" onclick="startFirebase()">Tizimga Ulanish</button>
    </div>
  </div>
</div>

<script>
// --- CONFIGURATSIYA ---
const firebaseConfig = {
    apiKey: "AIzaSyAGk2Ulw2sR5GMgKmrbKn6n-Eema0Advv4",
    databaseURL: "https://myautonomousrobot-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// --- STATE ---
let robot = { x: 0, y: 0, th: 0 };
let mapPoints = [];
let zoom = 0.5;

const canvas = document.getElementById('lidarCanvas');
const ctx = canvas.getContext('2d');
const area = document.getElementById('canvasArea');

function resize() {
    canvas.width = area.clientWidth;
    canvas.height = area.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// --- FIREBASE ALOQA ---
function startFirebase() {
    document.getElementById('connectOverlay').classList.add('hidden');
    document.getElementById('statusDot').classList.add('connected');
    document.getElementById('statusText').innerText = "ONLINE";

    // Robot koordinatalari
    db.ref('/robot/status').on('value', s => {
        if(s.exists()) robot = s.val();
    });

    // Lidar oqimi
    db.ref('/robot/lidar_stream').on('value', s => {
        const data = s.val();
        if(!data) return;
        
        Object.values(data).forEach(p => {
            const rad = (p.a + robot.th) * Math.PI / 180;
            const x = robot.x + Math.cos(rad) * p.d;
            const y = robot.y + Math.sin(rad) * p.d;
            mapPoints.push({x, y, d: p.d});
        });

        if(mapPoints.length > 10000) mapPoints.splice(0, 500);
        document.getElementById('statPoints').innerText = mapPoints.length;
    });
}

function sendCmd(c) { db.ref('/robot/command').set(c); }

function clearMap() { mapPoints = []; }

// --- RENDER ---
function draw() {
    ctx.fillStyle = '#050a0e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    // Grid
    ctx.strokeStyle = '#0d2a3a';
    ctx.lineWidth = 1;
    for(let i=-2000; i<2000; i+=500) {
        ctx.beginPath(); ctx.moveTo(cx + i*zoom, 0); ctx.lineTo(cx + i*zoom, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, cy + i*zoom); ctx.lineTo(canvas.width, cy + i*zoom); ctx.stroke();
    }

    // Nuqtalar
    ctx.fillStyle = '#00ff88';
    mapPoints.forEach(p => {
        const sx = cx + (p.x - robot.x) * zoom;
        const sy = cy + (p.y - robot.y) * zoom;
        ctx.fillRect(sx, sy, 2, 2);
    });

    // Robot
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(robot.th * Math.PI / 180);
    ctx.fillStyle = '#ff4d6d';
    ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(-8,-7); ctx.lineTo(-8,7); ctx.fill();
    ctx.restore();

    requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
