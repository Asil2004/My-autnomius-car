<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRA-1: Autonomous OS</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-green: #00ff88;
            --neon-red: #ff0055;
            --bg-dark: #02060a;
            --panel-bg: rgba(10, 20, 30, 0.8);
            --glass-border: rgba(0, 242, 255, 0.2);
            --font-main: 'JetBrains Mono', monospace;
            --font-header: 'Orbitron', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            background: var(--bg-dark);
            color: #e0f7fa;
            font-family: var(--font-main);
            height: 100vh;
            display: grid;
            grid-template-columns: 320px 1fr 300px;
            grid-template-rows: 70px 1fr;
            overflow: hidden;
        }

        /* 🟦 HEADER: Futuristic Navigation */
        header {
            grid-column: 1 / -1;
            background: linear-gradient(to bottom, #0a141e, transparent);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            backdrop-filter: blur(10px);
        }

        .system-title {
            font-family: var(--font-header);
            font-size: 20px;
            letter-spacing: 5px;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        /* 🟩 LEFT SIDEBAR: Diagnostics */
        .sidebar-left {
            background: var(--panel-bg);
            border-right: 1px solid var(--glass-border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .module-card {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--neon-blue);
            padding: 15px;
            position: relative;
        }

        .module-title {
            font-size: 10px;
            color: var(--neon-blue);
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        /* 🕹️ CENTER: The Map Viewport */
        .viewport {
            position: relative;
            background: 
                radial-gradient(circle at center, rgba(0, 242, 255, 0.05) 0%, transparent 70%),
                linear-gradient(rgba(0, 242, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.2));
        }

        /* 🟥 RIGHT SIDEBAR: Controls */
        .sidebar-right {
            background: var(--panel-bg);
            border-left: 1px solid var(--glass-border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .nav-btn {
            background: rgba(0, 242, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--neon-blue);
            padding: 15px;
            font-size: 18px;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: var(--neon-blue);
            color: var(--bg-dark);
            box-shadow: 0 0 20px var(--neon-blue);
        }

        .nav-btn:active { transform: scale(0.9); }

        /* 🔋 UI ELEMENTS: Status bars */
        .stat-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            width: 100%;
            margin-top: 5px;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            background: var(--neon-green);
            width: 75%; /* Dinamik o'zgaradi */
            box-shadow: 0 0 10px var(--neon-green);
        }

        /* 📡 HUD OVERLAYS */
        .hud-scanline {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(0, 242, 255, 0.1);
            top: 0;
            animation: scan 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>

<header>
    <div class="system-title">ASTRA-OS v2.0</div>
    <div id="connection-status" style="color: var(--neon-green); font-size: 12px;">● SYSTEM ONLINE</div>
</header>

<div class="sidebar-left">
    <div class="module-card">
        <span class="module-title">Locational Data</span>
        <div style="font-size: 18px; color: var(--neon-blue);">X: <span id="pos-x">0.0</span></div>
        <div style="font-size: 18px; color: var(--neon-blue);">Y: <span id="pos-y">0.0</span></div>
    </div>

    <div class="module-card">
        <span class="module-title">IMU Gyroscope</span>
        <div id="gyro-val" style="font-family: Orbitron; font-size: 22px;">180.00°</div>
        <div class="stat-bar"><div class="stat-fill" style="width: 50%;"></div></div>
    </div>

    <div class="module-card">
        <span class="module-title">Lidar Density</span>
        <div id="point-count">Points: 0</div>
    </div>
</div>

<div class="viewport" id="viewport">
    <div class="hud-scanline"></div>
    <canvas id="mainCanvas"></canvas>
</div>

<div class="sidebar-right">
    <div class="module-title" style="text-align: center;">Manual Override</div>
    <div class="control-grid">
        <div></div><button class="nav-btn" onmousedown="cmd('forward')" onmouseup="cmd('stop')">W</button><div></div>
        <button class="nav-btn" onmousedown="cmd('left')" onmouseup="cmd('stop')">A</button>
        <button class="nav-btn" onmousedown="cmd('back')" onmouseup="cmd('stop')">S</button>
        <button class="nav-btn" onmousedown="cmd('right')" onmouseup="cmd('stop')">D</button>
    </div>

    <div class="module-card" style="border-left-color: var(--neon-red);">
        <span class="module-title">System Actions</span>
        <button class="nav-btn" style="width: 100%; font-size: 12px;" onclick="clearMap()">Purge Map Cache</button>
        <button class="nav-btn" style="width: 100%; font-size: 12px; margin-top: 10px;" id="auto-btn" onclick="toggleAuto()">Initialize Autopilot</button>
    </div>
</div>

<script>
    // Firebase va boshqaruv logikasi bu yerga keladi (oldingi koddagi kabi)
    // Canvas chizish va robot harakati algoritmlari...
</script>

</body>
</html>
