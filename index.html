<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>ASTRA-OS v2.0 | LIDAR READY</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --neon: #00f2ff; --bg: #02060a; }
        body { background: var(--bg); color: #fff; margin: 0; display: grid; grid-template-columns: 280px 1fr; height: 100vh; font-family: 'Courier New', monospace; }
        .sidebar { padding: 20px; border-right: 1px solid var(--neon); background: rgba(10,20,30,0.9); }
        .viewport { position: relative; cursor: crosshair; background: radial-gradient(circle, #102030 1px, transparent 1px); background-size: 30px 30px; }
        canvas { width: 100%; height: 100%; }
        .btn { width: 100%; padding: 10px; margin: 5px 0; background: none; border: 1px solid var(--neon); color: var(--neon); cursor: pointer; }
        .btn:hover { background: var(--neon); color: #000; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="color:var(--neon)">ASTRA-OS</h2>
    <div id="stats">X: 0 | Y: 0 | θ: 0°</div>
    <hr style="border-color: #1a3a4a">
    <button class="btn" onmousedown="send('forward')" onmouseup="send('stop')">OLDINGA (W)</button>
    <div style="display: flex; gap: 5px;">
        <button class="btn" onmousedown="send('left')" onmouseup="send('stop')">CHAP (A)</button>
        <button class="btn" onmousedown="send('right')" onmouseup="send('stop')">O'NG (D)</button>
    </div>
    <button class="btn" onclick="clearMap()">XARITANI TOZALASH</button>
</div>

<div class="viewport">
    <canvas id="lidarCanvas"></canvas>
</div>

<script>
    const config = {
        apiKey: "AIzaSyAGk2Ulw2sR5GMgKmrbKn6n-Eema0Advv4",
        databaseURL: "https://myautonomousrobot-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(config);
    const db = firebase.database();

    const canvas = document.getElementById('lidarCanvas');
    const ctx = canvas.getContext('2d');
    let robot = { x:0, y:0, th:0 };
    let points = [];

    function send(c) { db.ref('/robot/command').set(c); }
    function clearMap() { points = []; db.ref('/robot/lidar_stream').remove(); }

    // Robot statusini yangilash
    db.ref('/robot/status').on('value', s => {
        robot = s.val();
        document.getElementById('stats').innerText = `X: ${robot.x.toFixed(1)} | Y: ${robot.y.toFixed(1)} | ${robot.th.toFixed(0)}°`;
    });

    // Lidar nuqtalarini qabul qilish
    db.ref('/robot/lidar_stream').limitToLast(20).on('child_added', s => {
        const p = s.val();
        // Global koordinataga o'tkazish
        const angle = (p.a + robot.th) * Math.PI / 180;
        const lx = robot.x + Math.cos(angle) * (p.d / 10);
        const ly = robot.y + Math.sin(angle) * (p.d / 10);
        points.push({x: lx, y: ly});
        if(points.length > 2000) points.shift();
    });

    function draw() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        const cx = canvas.width/2;
        const cy = canvas.height/2;

        // Nuqtalarni chizish
        ctx.fillStyle = "#00ff88";
        points.forEach(p => {
            ctx.fillRect(cx + p.x - robot.x, cy + p.y - robot.y, 2, 2);
        });

        // Robot markeri
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(robot.th * Math.PI/180);
        ctx.fillStyle = "#ff4d6d";
        ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(-8,-7); ctx.lineTo(-8,7); ctx.fill();
        ctx.restore();

        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
