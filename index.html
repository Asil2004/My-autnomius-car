<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>ASTRA-OS v2.0 | LIDAR READY</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --neon: #00f2ff; --bg: #02060a; }
        body { background: var(--bg); color: #fff; margin: 0; display: grid; grid-template-columns: 280px 1fr; height: 100vh; font-family: 'Courier New', monospace; }
        .sidebar { padding: 20px; border-right: 1px solid var(--neon); background: rgba(10,20,30,0.9); }
        .viewport { position: relative; cursor: crosshair; background: radial-gradient(circle, #102030 1px, transparent 1px); background-size: 30px 30px; }
        canvas { width: 100%; height: 100%; }
        .btn { width: 100%; padding: 10px; margin: 5px 0; background: none; border: 1px solid var(--neon); color: var(--neon); cursor: pointer; }
        .btn:hover { background: var(--neon); color: #000; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="color:var(--neon)">ASTRA-OS</h2>
    <div id="stats">X: 0 | Y: 0 | θ: 0°</div>
    <hr style="border-color: #1a3a4a">
    <button class="btn" onmousedown="send('forward')" onmouseup="send('stop')">OLDINGA (W)</button>
    <div style="display: flex; gap: 5px;">
        <button class="btn" onmousedown="send('left')" onmouseup="send('stop')">CHAP (A)</button>
        <button class="btn" onmousedown="send('right')" onmouseup="send('stop')">O'NG (D)</button>
    </div>
    <button class="btn" onclick="clearMap()">XARITANI TOZALASH</button>
</div>

<div class="viewport">
    <canvas id="lidarCanvas"></canvas>
</div>

<script>
// --- FIREBASE INTEGRATSIYASI ---
const firebaseConfig = {
    apiKey: "AIzaSyAGk2Ulw2sR5GMgKmrbKn6n-Eema0Advv4",
    databaseURL: "https://myautonomousrobot-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let robot = { x: 0, y: 0, th: 0 };
let mapPoints = [];
let zoom = 1.0;

// Robot holatini yangilash
db.ref('/robot/status').on('value', (snapshot) => {
    if (snapshot.exists()) {
        robot = snapshot.val();
        setStatus('connected', 'ONLINE');
        document.getElementById('coordsOverlay').innerHTML = `X: ${robot.x.toFixed(0)} mm<br>Y: ${robot.y.toFixed(0)} mm`;
    }
});

// Lidar nuqtalarini qabul qilish va xaritaga chizish
db.ref('/robot/lidar_stream').on('value', (snapshot) => {
    const data = snapshot.val();
    if (!data) return;

    Object.values(data).forEach(p => {
        const rad = (p.a + robot.th) * Math.PI / 180;
        const x = robot.x + Math.cos(rad) * p.d;
        const y = robot.y + Math.sin(rad) * p.d;
        
        mapPoints.push({ x, y, dist: p.d, angle: p.a });
    });

    if (mapPoints.length > 10000) mapPoints.splice(0, 500);
    updateStats();
});

// Boshqaruv tugmalari funksiyasi
function sendCommand(cmd) {
    db.ref('/robot/command').set(cmd);
}

// HTML dagi tugmalarni Firebase ga bog'lash
// Buning uchun HTML dagi mousedown/mouseup qismlarini yangilang:
// Masalan: onmousedown="sendCommand('forward')" onmouseup="sendCommand('stop')"

function updateStats() {
    document.getElementById('statPoints').textContent = mapPoints.length.toLocaleString();
    if (mapPoints.length > 0) {
        const lastD = mapPoints[mapPoints.length - 1].dist;
        document.getElementById('statMaxDist').textContent = (lastD / 1000).toFixed(2) + " m";
    }
}

// Canvas render mantiqi (Siz yuborgan fayldagi drawGrid va render funksiyalarini saqlab qoling)
</script>
</body>
</html>
