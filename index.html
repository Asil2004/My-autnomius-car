<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>ASTRA-OS v2.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #02060a; --panel: rgba(10, 20, 30, 0.9); }
        body { background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; display: grid; grid-template-columns: 300px 1fr; height: 100vh; margin: 0; }
        
        .sidebar { background: var(--panel); padding: 20px; border-right: 1px solid var(--neon); display: flex; flex-direction: column; gap: 20px; }
        h1 { font-family: 'Orbitron'; color: var(--neon); font-size: 18px; letter-spacing: 3px; }
        
        .viewport { position: relative; overflow: hidden; background: radial-gradient(circle, #102030 1px, transparent 1px); background-size: 40px 40px; }
        canvas { width: 100%; height: 100%; }

        .btn { background: rgba(0, 242, 255, 0.1); border: 1px solid var(--neon); color: var(--neon); padding: 12px; cursor: pointer; transition: 0.3s; font-family: 'Orbitron'; }
        .btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 15px var(--neon); }
        .btn.active { background: #00ff88; border-color: #00ff88; color: #000; }

        .stat-box { border-left: 3px solid var(--neon); padding-left: 10px; margin-bottom: 10px; }
        .label { font-size: 10px; color: #5a7a8a; }
    </style>
</head>
<body>

<div class="sidebar">
    <h1>ASTRA-OS</h1>
    <div class="stat-box">
        <div class="label">COORDINATES</div>
        <div id="pos-info">X: 0.0 | Y: 0.0</div>
    </div>
    
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button class="btn active" id="m0" onclick="setMode(0)">MANUAL</button>
        <button class="btn" id="m1" onclick="setMode(1)">AUTO</button>
    </div>

    <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap: 5px;">
        <div></div><button class="btn" onmousedown="send('forward')" onmouseup="send('stop')">W</button><div></div>
        <button class="btn" onmousedown="send('left')" onmouseup="send('stop')">A</button>
        <button class="btn" onmousedown="send('back')" onmouseup="send('stop')">S</button>
        <button class="btn" onmousedown="send('right')" onmouseup="send('stop')">D</button>
    </div>
    <button class="btn" style="border-color: #ff4d6d; color: #ff4d6d;" onclick="db.ref('/robot/lidar_map').set(null)">PURGE MAP</button>
</div>

<div class="viewport" id="v">
    <canvas id="c"></canvas>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAGk2Ulw2sR5GMgKmrbKn6n-Eema0Advv4",
        databaseURL: "https://myautonomousrobot-default-rtdb.firebaseio.com",
        projectId: "myautonomousrobot"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let robot = { x:0, y:0, th:0 };

    function send(c) { db.ref('/robot/command').set(c); }
    function setMode(m) { 
        db.ref('/robot/mode').set(m); 
        document.getElementById('m0').className = m==0 ? 'btn active' : 'btn';
        document.getElementById('m1').className = m==1 ? 'btn active' : 'btn';
    }

    db.ref('/robot/status').on('value', s => {
        robot = s.val();
        document.getElementById('pos-info').innerText = `X: ${robot.x.toFixed(1)} | Y: ${robot.y.toFixed(1)}`;
    });

    function draw() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
        ctx.clearRect(0,0,canvas.width, canvas.height);
        
        // Robot markeri
        ctx.save();
        ctx.translate(canvas.width/2, canvas.height/2);
        ctx.rotate(robot.th * Math.PI/180);
        ctx.fillStyle = "#00f2ff";
        ctx.beginPath(); ctx.moveTo(15,0); ctx.lineTo(-10,-10); ctx.lineTo(-10,10); ctx.fill();
        ctx.restore();
        
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
