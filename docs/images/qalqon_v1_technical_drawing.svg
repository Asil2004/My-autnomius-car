<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#0a0f18; font-family:'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <!-- Blueprint grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#122438" stroke-width="1"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#1b3654" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="domeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="tireGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="strobeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff0033"/>
    </linearGradient>
  </defs>

  <!-- Background Grid -->
  <rect width="1200" height="800" fill="url(#grid)" />

  <!-- Title Block -->
  <rect x="30" y="30" width="1140" height="70" fill="#0d1929" stroke="#00e5ff" stroke-width="2" rx="6"/>
  <text x="50" y="65" fill="#00e5ff" font-size="20" font-weight="bold" letter-spacing="2">🛡️ QALQON v1.0 — POLICE PATROL AMR | RASMIY KONSTRUKTORLIK CHIZMASI</text>
  <text x="50" y="88" fill="#94a3b8" font-size="12">Mas'ul: Asilbek Ravshanov | Konstruktorlar: Muhammadali &amp; Lazizbek | Elektronika: Abduvali | Masshtab: 1:5 | Standart: IIB &amp; NDKvaTU</text>

  <!-- ==================== VIEW 1: FRONT VIEW (OLD KO'RINISH) ==================== -->
  <g transform="translate(180, 480)">
    <!-- Baseplate & Suspension -->
    <rect x="-140" y="30" width="280" height="25" fill="#334155" stroke="#64748b" stroke-width="2" rx="4"/>
    <line x1="-140" y1="42" x2="-210" y2="60" stroke="#475569" stroke-width="8"/>
    <line x1="140" y1="42" x2="210" y2="60" stroke="#475569" stroke-width="8"/>
    <circle cx="-210" cy="60" r="10" fill="#94a3b8"/>
    <circle cx="210" cy="60" r="10" fill="#94a3b8"/>

    <!-- Left & Right Front Tires (130mm) -->
    <rect x="-245" y="10" width="55" height="120" rx="16" fill="url(#tireGrad)" stroke="#475569" stroke-width="3"/>
    <rect x="190" y="10" width="55" height="120" rx="16" fill="url(#tireGrad)" stroke="#475569" stroke-width="3"/>
    <!-- Tire treads -->
    <path d="M -245 35 L -230 35 M -245 60 L -230 60 M -245 85 L -230 85 M -245 110 L -230 110" stroke="#64748b" stroke-width="3"/>
    <path d="M 245 35 L 230 35 M 245 60 L 230 60 M 245 85 L 230 85 M 245 110 L 230 110" stroke="#64748b" stroke-width="3"/>

    <!-- Main Hemispherical Dome (500mm dia -> r=170 scale) -->
    <path d="M -170 30 A 170 170 0 0 1 170 30 Z" fill="url(#domeGrad)" stroke="#0f172a" stroke-width="3"/>
    
    <!-- Police Blue Decal Band -->
    <path d="M -168 10 A 170 170 0 0 1 168 10 L 164 25 A 170 170 0 0 0 -164 25 Z" fill="#1e3a8a"/>
    <text x="0" y="21" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="4">POLICE QALQON v1.0</text>

    <!-- Front 8.7" Tablet Assembly -->
    <rect x="-70" y="-75" width="140" height="95" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="3"/>
    <rect x="-62" y="-68" width="124" height="80" rx="4" fill="#030712"/>
    <!-- Cyber AI Eyes -->
    <ellipse cx="-28" cy="-30" rx="16" ry="14" fill="none" stroke="#00e5ff" stroke-width="4"/>
    <ellipse cx="28" cy="-30" rx="16" ry="14" fill="none" stroke="#00e5ff" stroke-width="4"/>
    <circle cx="-28" cy="-30" r="6" fill="#00e5ff"/>
    <circle cx="28" cy="-30" r="6" fill="#00e5ff"/>
    <!-- SOS 102 Badge -->
    <rect x="-24" y="-3" width="48" height="12" rx="3" fill="#dc2626"/>
    <text x="0" y="6" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">102 SOS</text>

    <!-- Speaker Grille -->
    <rect x="-40" y="32" width="80" height="18" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <circle cx="-24" cy="41" r="2" fill="#94a3b8"/><circle cx="-12" cy="41" r="2" fill="#94a3b8"/>
    <circle cx="0" cy="41" r="2" fill="#94a3b8"/><circle cx="12" cy="41" r="2" fill="#94a3b8"/><circle cx="24" cy="41" r="2" fill="#94a3b8"/>

    <!-- Retractable Mast (Deployed / Ko'tarilgan) -->
    <!-- Mast Stem -->
    <rect x="-18" y="-220" width="36" height="80" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <!-- Floodlights -->
    <circle cx="-42" cy="-190" r="14" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="-42" cy="-190" r="9" fill="#fef08a"/>
    <circle cx="42" cy="-190" r="14" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="42" cy="-190" r="9" fill="#fef08a"/>
    <!-- 360 Strobe LED Lightbar -->
    <rect x="-55" y="-210" width="110" height="16" rx="6" fill="url(#strobeGrad)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Dual Stereo AI Cameras -->
    <rect x="-30" y="-192" width="60" height="20" rx="5" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <circle cx="-14" cy="-182" r="6" fill="#0284c7"/><circle cx="14" cy="-182" r="6" fill="#0284c7"/>
    <!-- Top Cap (Disk) -->
    <ellipse cx="0" cy="-225" rx="70" ry="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>

    <!-- Dimension Lines: Front Width -->
    <line x1="-245" y1="145" x2="245" y2="145" stroke="#00e5ff" stroke-width="1.5"/>
    <line x1="-245" y1="135" x2="-245" y2="155" stroke="#00e5ff" stroke-width="1.5"/>
    <line x1="245" y1="135" x2="245" y2="155" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="0" y="165" fill="#00e5ff" font-size="13" font-weight="bold" text-anchor="middle">UMUMIY KENG LIGI: 560 mm</text>

    <!-- Dome Diameter -->
    <line x1="-170" y1="-100" x2="170" y2="-100" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="0" y="-110" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">GUMBAZ DIAMETRI: Ø 500 mm</text>
  </g>
  <text x="180" y="700" fill="#e2e8f0" font-size="16" font-weight="bold" text-anchor="middle">A-A: OLD KO'RINISH (FRONT VIEW)</text>

  <!-- ==================== VIEW 2: SIDE PROFILE (YON PROFIL) ==================== -->
  <g transform="translate(680, 480)">
    <!-- Baseplate -->
    <rect x="-180" y="30" width="360" height="25" fill="#334155" stroke="#64748b" stroke-width="2" rx="4"/>

    <!-- Front & Rear Tires -->
    <circle cx="130" cy="70" r="60" fill="url(#tireGrad)" stroke="#475569" stroke-width="4"/>
    <circle cx="130" cy="70" r="28" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="-130" cy="70" r="60" fill="url(#tireGrad)" stroke="#475569" stroke-width="4"/>
    <circle cx="-130" cy="70" r="28" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>

    <!-- Battery Compartment (Lower Center) -->
    <rect x="-70" y="15" width="140" height="40" fill="#0f172a" stroke="#22c55e" stroke-width="2" rx="4"/>
    <text x="0" y="40" fill="#22c55e" font-size="11" font-weight="bold" text-anchor="middle">12V 25Ah LiFePO4</text>

    <!-- Side Dome Profile (Hemisphere) -->
    <path d="M -180 30 A 180 180 0 0 1 180 30 Z" fill="url(#domeGrad)" stroke="#0f172a" stroke-width="3"/>

    <!-- 65 degree Front Visor Slant (Planshet qiyaligi) -->
    <path d="M 120 -20 L 170 30 L 125 30 Z" fill="#020617"/>
    <line x1="120" y1="-20" x2="165" y2="30" stroke="#38bdf8" stroke-width="4"/>
    <text x="175" y="-5" fill="#38bdf8" font-size="11" font-weight="bold">65° QIYALIK</text>

    <!-- Deployable Mast Stem & Top -->
    <rect x="-15" y="-220" width="30" height="80" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <rect x="-35" y="-210" width="70" height="16" rx="6" fill="url(#strobeGrad)"/>
    <ellipse cx="0" cy="-225" rx="65" ry="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    
    <!-- Docking Charging Port (Rear) -->
    <rect x="-190" y="25" width="15" height="20" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="-205" y="40" fill="#f59e0b" font-size="10" font-weight="bold" text-anchor="end">DOCK PORT</text>

    <!-- Dimensions: Height Deployed & Stowed -->
    <line x1="260" y1="130" x2="260" y2="-225" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="250" y1="130" x2="270" y2="130" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="250" y1="-225" x2="270" y2="-225" stroke="#ef4444" stroke-width="1.5"/>
    <text x="280" y="-45" fill="#ef4444" font-size="12" font-weight="bold" transform="rotate(90, 280, -45)">BALANDLIK: 720 mm (MINORA OCHIQ)</text>

    <!-- Ground Clearance -->
    <line x1="0" y1="130" x2="0" y2="55" stroke="#22c55e" stroke-width="1.5"/>
    <text x="15" y="100" fill="#22c55e" font-size="11" font-weight="bold">KLIRENS: 65 mm</text>

    <!-- Wheelbase -->
    <line x1="-130" y1="150" x2="130" y2="150" stroke="#00e5ff" stroke-width="1.5"/>
    <line x1="-130" y1="140" x2="-130" y2="160" stroke="#00e5ff" stroke-width="1.5"/>
    <line x1="130" y1="140" x2="130" y2="160" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="0" y="170" fill="#00e5ff" font-size="12" font-weight="bold" text-anchor="middle">BAZA (O'QLAR OROSI): 420 mm</text>
  </g>
  <text x="680" y="700" fill="#e2e8f0" font-size="16" font-weight="bold" text-anchor="middle">B-B: YON PROFIL VA ZARYAD PORTI (SIDE VIEW)</text>

  <!-- ==================== SPECIFICATIONS BLOCK ==================== -->
  <g transform="translate(980, 130)">
    <rect x="0" y="0" width="190" height="340" fill="#0f172a" stroke="#334155" stroke-width="1.5" rx="6"/>
    <text x="15" y="28" fill="#38bdf8" font-size="12" font-weight="bold">📐 ASOSIY GABARITLAR:</text>
    <text x="15" y="55" fill="#cbd5e1" font-size="11">• Gumbaz: Ø 500 mm</text>
    <text x="15" y="75" fill="#cbd5e1" font-size="11">• Eni: 560 mm</text>
    <text x="15" y="95" fill="#cbd5e1" font-size="11">• Uzunligi: 580 mm</text>
    <text x="15" y="115" fill="#cbd5e1" font-size="11">• Minora yopiq: 520 mm</text>
    <text x="15" y="135" fill="#cbd5e1" font-size="11">• Minora ochiq: 720 mm</text>
    <text x="15" y="155" fill="#cbd5e1" font-size="11">• Klirens: 65 mm</text>

    <text x="15" y="190" fill="#22c55e" font-size="12" font-weight="bold">⚙️ APPARAT QISMLAR:</text>
    <text x="15" y="215" fill="#cbd5e1" font-size="11">• 4x 12V DC JGB37-520</text>
    <text x="15" y="235" fill="#cbd5e1" font-size="11">• 4x 130mm Rezina Shina</text>
    <text x="15" y="255" fill="#cbd5e1" font-size="11">• 12V 150mm Aktuator</text>
    <text x="15" y="275" fill="#cbd5e1" font-size="11">• 8.7" Kiosk Planshet</text>
    <text x="15" y="295" fill="#cbd5e1" font-size="11">• 12V 25Ah LiFePO4</text>
    <text x="15" y="315" fill="#cbd5e1" font-size="11">• Og'irlik: ~22-26 kg</text>
  </g>

  <!-- Bottom Legend -->
  <rect x="30" y="740" width="1140" height="35" fill="#0d1929" stroke="#1e293b" stroke-width="1" rx="4"/>
  <text x="50" y="763" fill="#94a3b8" font-size="12">ESLATMA: Barcha o'lchamlar millimetrda (mm). Qalqon v1.0 tasdiqlangan kanonik 3D renderi asosida muhandislik yig'masi uchun ishlab chiqildi.</text>
</svg>
