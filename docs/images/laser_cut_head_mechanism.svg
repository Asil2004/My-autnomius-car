<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320mm" height="220mm">
  <style>
    .cut { fill: none; stroke: #ff0000; stroke-width: 0.2; }
    .engrave { fill: none; stroke: #0000ff; stroke-width: 0.15; stroke-dasharray: 1,1; }
    .text { font-family: Arial, sans-serif; font-size: 3.5px; fill: #111; }
    .dim { font-family: Arial, sans-serif; font-size: 2.8px; fill: #555; }
    .title { font-family: Arial, sans-serif; font-size: 5px; font-weight: bold; fill: #000; }
  </style>

  <!-- Title / Legend -->
  <text x="10" y="10" class="title">ESP32-2432S028 + 2x SG90 Pan-Tilt Bosh Mexanizmi (3mm Material)</text>
  <text x="10" y="15" class="dim">Qizil chiziq (#FF0000): Kesish (Cut) | Moviy chiziq (#0000FF): Markalash/O'q chizig'i</text>

  <!-- ========================================== -->
  <!-- 1. PART 1: PAN BASE PLATE (Pastki Asos)   -->
  <!-- Pos: X=10, Y=25, Size: 60x60 mm            -->
  <!-- ========================================== -->
  <g id="part1_pan_base" transform="translate(10, 25)">
    <!-- Outer boundary with rounded corners -->
    <rect x="0" y="0" width="60" height="60" rx="3" class="cut" />
    <text x="30" y="8" text-anchor="middle" class="text">1. PAN ASOS (Chassisga qotiriladi)</text>
    
    <!-- SG90 servo cutout: 23.0 x 12.3 mm, centered at (30, 32) -->
    <!-- Center of servo cutout: (30, 30) -->
    <rect x="18.5" y="23.85" width="23.0" height="12.3" class="cut" />
    <!-- SG90 screw holes: 28mm apart (X: 16.0 and 44.0, Y: 30) -->
    <circle cx="16.0" cy="30.0" r="1.1" class="cut" />
    <circle cx="44.0" cy="30.0" r="1.1" class="cut" />
    
    <!-- Chassis mounting holes: 4x M3 (radius 1.6mm) at corners (8mm from edge) -->
    <circle cx="8" cy="8" r="1.6" class="cut" />
    <circle cx="52" cy="8" r="1.6" class="cut" />
    <circle cx="8" cy="52" r="1.6" class="cut" />
    <circle cx="52" cy="52" r="1.6" class="cut" />
    <text x="30" y="56" text-anchor="middle" class="dim">60 x 60 mm</text>
  </g>

  <!-- ========================================== -->
  <!-- 2. PART 2: TURRET ROTATING BASE (Aylanuvchi Stol) -->
  <!-- Pos: X=80, Y=25, Size: 50x36 mm            -->
  <!-- ========================================== -->
  <g id="part2_pan_turret" transform="translate(80, 25)">
    <rect x="0" y="0" width="50" height="36" rx="2" class="cut" />
    <text x="25" y="7" text-anchor="middle" class="text">2. TURRET (Pan Kachalkasiga)</text>
    
    <!-- Center SG90 horn mounting holes -->
    <!-- Center shaft hole: 2.2mm -->
    <circle cx="25" cy="18" r="1.2" class="cut" />
    <!-- Horn arm screw holes: 14mm apart (25-7=18, 25+7=32) -->
    <circle cx="18" cy="18" r="0.9" class="cut" />
    <circle cx="32" cy="18" r="0.9" class="cut" />
    
    <!-- Left vertical arm slot: 3.1mm width (for 3mm material), 12mm length -->
    <rect x="4" y="12" width="3.1" height="12" class="cut" />
    <!-- Right vertical arm slot: 3.1mm width, 12mm length -->
    <rect x="42.9" y="12" width="3.1" height="12" class="cut" />
    <text x="25" y="32" text-anchor="middle" class="dim">50 x 36 mm</text>
  </g>

  <!-- ========================================== -->
  <!-- 3. PART 3A: LEFT TILT TOWER (Chap Ustun - Servo) -->
  <!-- Pos: X=140, Y=25, Size: 26x52 mm           -->
  <!-- ========================================== -->
  <g id="part3a_left_tower" transform="translate(140, 25)">
    <path d="M 0 0 L 26 0 L 26 46 L 22.9 46 L 22.9 52 L 3.1 52 L 3.1 46 L 0 46 Z" class="cut" />
    <text x="13" y="8" text-anchor="middle" class="text">3A. CHAP USTUN</text>
    <text x="13" y="13" text-anchor="middle" class="dim">(Tilt Servo SG90)</text>
    
    <!-- Cutout for SG90: 12.3 x 23.0 mm (vertical) centered at X=13, Y=28 -->
    <rect x="6.85" y="16.5" width="12.3" height="23.0" class="cut" />
    <!-- Servo screw holes 28mm apart (Y=14.0, Y=42.0 at X=13) -->
    <circle cx="13" cy="14.0" r="1.1" class="cut" />
    <circle cx="13" cy="42.0" r="1.1" class="cut" />
  </g>

  <!-- ========================================== -->
  <!-- 4. PART 3B: RIGHT TILT TOWER (O'ng Ustun - Podshipnik/O'q) -->
  <!-- Pos: X=175, Y=25, Size: 26x52 mm          -->
  <!-- ========================================== -->
  <g id="part3b_right_tower" transform="translate(175, 25)">
    <path d="M 0 0 L 26 0 L 26 46 L 22.9 46 L 22.9 52 L 3.1 52 L 3.1 46 L 0 46 Z" class="cut" />
    <text x="13" y="8" text-anchor="middle" class="text">3B. O'NG USTUN</text>
    <text x="13" y="13" text-anchor="middle" class="dim">(Aylanuvchi M3 O'q)</text>
    
    <!-- Pivot hole M3 at X=13, Y=28 (aligned with SG90 output spline) -->
    <circle cx="13" cy="28.0" r="1.6" class="cut" />
    <circle cx="13" cy="28.0" r="4.0" class="engrave" />
  </g>

  <!-- ========================================== -->
  <!-- 5. PART 4: ESP32 CYD BACK PLATE (Orqa Ramka) -->
  <!-- Pos: X=10, Y=100, Size: 86x50 mm           -->
  <!-- ESP32-2432S028 Exact Dimensions: 86 x 50 mm -->
  <!-- Corner holes: 80 x 44 mm spacing, 3.2mm M3 -->
  <!-- ========================================== -->
  <g id="part4_cyd_back_plate" transform="translate(10, 100)">
    <rect x="0" y="0" width="86" height="50" rx="3" class="cut" />
    <text x="43" y="9" text-anchor="middle" class="text">4. ESP32-2432S028 ORQA USHLAGICH PLASTINA</text>
    
    <!-- 4x Corner M3 mounting holes for ESP32 (80 x 44 mm pitch) -->
    <!-- Offset: 3mm from top/bottom/left/right -->
    <circle cx="3" cy="3" r="1.6" class="cut" />
    <circle cx="83" cy="3" r="1.6" class="cut" />
    <circle cx="3" cy="47" r="1.6" class="cut" />
    <circle cx="83" cy="47" r="1.6" class="cut" />

    <!-- Center Tilt Servo Horn mounting bracket holes -->
    <!-- Attached to Tilt servo horn at left side: X=12, Y=25 -->
    <circle cx="12" cy="25" r="1.2" class="cut" />
    <circle cx="12" cy="18" r="0.9" class="cut" />
    <circle cx="12" cy="32" r="0.9" class="cut" />

    <!-- Right side idle pivot M3 hole: X=74, Y=25 -->
    <circle cx="74" cy="25" r="1.6" class="cut" />

    <!-- Large window cutout for ESP32 components ventilation & USB/pins access -->
    <rect x="22" y="12" width="44" height="26" rx="2" class="cut" />
    <text x="44" y="26" text-anchor="middle" class="dim">Simlar va shamollatish darchasi</text>
    
    <text x="43" y="45" text-anchor="middle" class="dim">O'lchami: 86.0 x 50.0 mm | Teshiklar orasi: 80.0 x 44.0 mm</text>
  </g>

  <!-- ========================================== -->
  <!-- 6. PART 5: ESP32 FRONT BEZEL (Old Ramka)  -->
  <!-- Pos: X=110, Y=100, Size: 86x50 mm          -->
  <!-- ========================================== -->
  <g id="part5_cyd_front_bezel" transform="translate(110, 100)">
    <rect x="0" y="0" width="86" height="50" rx="3" class="cut" />
    <text x="43" y="9" text-anchor="middle" class="text">5. ESP32 OLD HIMOYACHI ESTETIK RAMKA</text>
    
    <!-- 4x Corner M3 mounting holes matching ESP32 -->
    <circle cx="3" cy="3" r="1.6" class="cut" />
    <circle cx="83" cy="3" r="1.6" class="cut" />
    <circle cx="3" cy="47" r="1.6" class="cut" />
    <circle cx="83" cy="47" r="1.6" class="cut" />

    <!-- 2.8 inch TFT Screen Window: 59.0 x 45.0 mm, centered -->
    <rect x="13.5" y="11" width="59" height="34" rx="1.5" class="cut" />
    <text x="43" y="29" text-anchor="middle" class="dim">2.8" TFT Ekran Darchasi (59 x 34 mm)</text>
    
    <text x="43" y="48" text-anchor="middle" class="dim">86.0 x 50.0 mm</text>
  </g>

  <!-- ========================================== -->
  <!-- 7. PART 6: TILT L-BRACKETS / SPACERS (Ulovchi quloqlar) -->
  <!-- Pos: X=210, Y=100                           -->
  <!-- ========================================== -->
  <g id="part6_connectors" transform="translate(210, 100)">
    <text x="40" y="8" text-anchor="middle" class="text">6. EKRANNI USTUNLARGA ULOVCHI QULOQLAR</text>
    
    <!-- Left U-arm adapter -->
    <rect x="5" y="15" width="30" height="16" rx="2" class="cut" />
    <circle cx="12" cy="23" r="1.2" class="cut" />
    <circle cx="7" cy="23" r="0.9" class="cut" />
    <circle cx="17" cy="23" r="0.9" class="cut" />
    <circle cx="28" cy="23" r="1.6" class="cut" />
    <text x="20" y="37" text-anchor="middle" class="dim">Servo kachalka ulovchi</text>

    <!-- Right pivot adapter -->
    <rect x="45" y="15" width="30" height="16" rx="2" class="cut" />
    <circle cx="52" cy="23" r="1.6" class="cut" />
    <circle cx="68" cy="23" r="1.6" class="cut" />
    <text x="60" y="37" text-anchor="middle" class="dim">Erkin o'q (M3) ulovchi</text>
  </g>
</svg>
